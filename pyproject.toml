[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pinnfeed"
version = "0.1.0"
description = "Official Python client for the PinnFeed real-time Pinnacle odds API (REST + WebSocket)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "PinnFeed", email = "support@pinnfeed.io" }]
keywords = ["pinnacle", "odds", "sports-betting", "websocket", "api", "closing-line", "no-vig"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1", "websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "mypy>=1.8"]

[project.urls]
Homepage = "https://pinnfeed.io"
Documentation = "https://pinnfeed.io/docs"
Source = "https://github.com/pinnfeed/pinnfeed-python"
Issues = "https://github.com/pinnfeed/pinnfeed-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pinnfeed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src/pinnfeed"]
